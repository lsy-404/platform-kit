name: Build public packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir oauth install --frozen-lockfile
      - run: node test/public-boundary.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node test/fluent-selection.browser.mjs
      - run: node test/fluent-catalog.browser.mjs
      - run: node test/connection-panel.browser.mjs
      - run: pnpm pack:release
      - run: node test/release-consumer.mjs
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact=100 --no-banner
      - uses: actions/upload-artifact@v4
        with:
          name: public-packages
          path: |
            release/*.tgz
            release/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: release
      - name: Publish immutable package archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping published archives unchanged."
          else
            gh release create "$RELEASE_TAG" release/*.tgz release/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes "Apache-2.0 theme and complete OAuth packages. Install the archives directly from this repository."
          fi
