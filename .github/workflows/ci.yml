name: Build public packages
on:
  push:
    branches: [main]
    tags:
      - 'fluent-v*'
      - 'ui-tokens-v*'
      - 'model-auth-core-v*'
      - 'model-auth-providers-v*'
      - 'model-auth-vue-v*'
      - 'model-auth-native-v*'
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir model-auth install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path model-auth/rust/Cargo.toml -- --check
      - run: cargo test --manifest-path test/rust/Cargo.toml --locked
      - run: node test/public-boundary.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node test/fluent-selection.browser.mjs
      - run: node test/fluent-catalog.browser.mjs
      - run: node test/connection-panel.browser.mjs
      - run: pnpm pack:release
      - run: node test/release-consumer.mjs
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact=100 --no-banner
      - uses: actions/upload-artifact@v4
        with:
          name: public-packages
          path: |
            release/**
            release/SHA256SUMS
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public-packages
          path: release
      - name: Publish immutable package archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            fluent-v*) PACKAGE_DIR="platform-kit-fluent"; PACKAGE_LABEL="@platform-kit/fluent" ;;
            ui-tokens-v*) PACKAGE_DIR="platform-kit-ui-tokens"; PACKAGE_LABEL="@platform-kit/ui-tokens" ;;
            model-auth-core-v*) PACKAGE_DIR="model-auth-core"; PACKAGE_LABEL="@model-auth/core" ;;
            model-auth-providers-v*) PACKAGE_DIR="model-auth-providers"; PACKAGE_LABEL="@model-auth/providers" ;;
            model-auth-vue-v*) PACKAGE_DIR="model-auth-vue"; PACKAGE_LABEL="@model-auth/vue" ;;
            model-auth-native-v*) PACKAGE_DIR="model-auth-native"; PACKAGE_LABEL="model-auth-native" ;;
            *) echo "Unsupported package release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          archive=$(find "release/$PACKAGE_DIR" -type f \( -name '*.tgz' -o -name '*.crate' \) -print -quit)
          if [ -z "$archive" ]; then echo "No archive found for $PACKAGE_LABEL" >&2; exit 1; fi
          grep "^$PACKAGE_DIR/" release/SHA256SUMS > release/SHA256SUMS.selected
          mv release/SHA256SUMS.selected release/SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping published archives unchanged."
          else
            gh release create "$RELEASE_TAG" release/SHA256SUMS "$archive" --verify-tag --title "$RELEASE_TAG" --notes "Apache-2.0 $PACKAGE_LABEL package archive. Install the archive directly from this repository."
          fi
